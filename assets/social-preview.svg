  <text x="70" y="370" font-family="Inter" font-weight="700" font-size="52" fill="#F5F3EF">Small, quick, sharp.</text>
  <text x="70" y="430" font-family="Inter" font-size="27" fill="#C9C4BC">A programming language on LLVM.</text>
  <text x="70" y="470" font-family="Inter" font-size="27" fill="#C9C4BC">As fast as C. Learn it in an hour.</text>
  <text x="70" y="560" font-family="Inter" font-size="22" fill="#7D8590">github.com/Nexoniarz/Finch</text>
  <rect x="690" y="120" width="530" height="440" rx="22" fill="#12151D" stroke="#2E3445" stroke-width="2"/>
  <circle cx="722" cy="150" r="7" fill="#FF5F57"/><circle cx="746" cy="150" r="7" fill="#FEBC2E"/><circle cx="770" cy="150" r="7" fill="#28C840"/>
  <g transform="translate(726 202)" font-family="JetBrainsMono Nerd Font Mono, JetBrains Mono, DejaVu Sans Mono, monospace" font-size="23" xml:space="preserve">
      <text x="0" y="0"><tspan fill="#FF7A1A">struct</tspan><tspan fill="#F5F3EF"> Bird {</tspan></text>
      <text x="0" y="34"><tspan fill="#F5F3EF">    str name</tspan></text>
      <text x="0" y="68"><tspan fill="#F5F3EF">    int speed = </tspan><tspan fill="#FFC145">9</tspan></text>
      <text x="0" y="102"><tspan fill="#F5F3EF">}</tspan></text>
      <text x="0" y="170"><tspan fill="#FF7A1A">fn</tspan><tspan fill="#7AA2F7"> main</tspan><tspan fill="#F5F3EF">() {</tspan></text>
      <text x="0" y="204"><tspan fill="#F5F3EF">    flock := [</tspan><tspan fill="#7AA2F7">Bird</tspan><tspan fill="#F5F3EF">(name: </tspan><tspan fill="#9ECE6A">"finch"</tspan><tspan fill="#F5F3EF">)]</tspan></text>
      <text x="0" y="238"><tspan fill="#F5F3EF">    </tspan><tspan fill="#FF7A1A">for</tspan><tspan fill="#F5F3EF"> b </tspan><tspan fill="#FF7A1A">in</tspan><tspan fill="#F5F3EF"> flock {</tspan></text>
      <text x="0" y="272"><tspan fill="#F5F3EF">        </tspan><tspan fill="#7AA2F7">print</tspan><tspan fill="#F5F3EF">(b.name, </tspan><tspan fill="#9ECE6A">"is fast"</tspan><tspan fill="#F5F3EF">)</tspan></text>
      <text x="0" y="306"><tspan fill="#F5F3EF">    }</tspan></text>
      <text x="0" y="340"><tspan fill="#F5F3EF">}</tspan></text>
  </g>
